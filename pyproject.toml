[project]
name = "taskyn"
version = "1.0.0"
description = "AI-first personal project management system"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kaushik Hazra", email = "kaushikhazra@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9.0",
    "rich>=13.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",
    "email-validator>=2.0.0",
    "fastmcp>=2.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "fastmcp>=2.0.0",
]

[project.scripts]
taskyn = "taskyn.cli.main:app"
taskyn-service = "taskyn.service:handle_command_line"
taskyn-ui = "taskyn.web.ui_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskyn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
